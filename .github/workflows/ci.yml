name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Check frontend with jsdom
        run: |
          npm install --prefix "$RUNNER_TEMP/helm-jsdom" jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/helm-jsdom/node_modules" node tests/frontend_check.cjs
