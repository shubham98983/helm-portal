[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-portal"
version = "0.1.0"
description = "Read-only internal project command center"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["helm*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
